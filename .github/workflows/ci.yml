name: Application checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: githubsignals_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: disposable-test-password
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U postgres -d githubsignals_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_POSTGRES_URL: postgresql://postgres:disposable-test-password@127.0.0.1:5432/githubsignals_test
      NEXT_TELEMETRY_DISABLED: '1'
      APP_ENV: preview
      APP_URL: http://127.0.0.1:3001
      EMAIL_ENABLED: 'false'
      SIGNUPS_ENABLED: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-failures
          path: |
            playwright-report/
            test-results/
          retention-days: 7
